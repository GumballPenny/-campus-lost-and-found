name: Verify Lab 5
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      items-db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: campus_items
          POSTGRES_USER: css
          POSTGRES_PASSWORD: css
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U css -d campus_items" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -q verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/campus_items
          DB_USERNAME: css
          DB_PASSWORD: css
