spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

server:
  error:
    include-exception: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Campus Lost & Found
    description: Lost item registration and lookup service

app:
  jwt:
    issuer: campus-lost-and-found
